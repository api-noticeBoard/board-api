name: Deploy to Production

on:
  push:
    branches:  # dev, test, main 브랜치에 push 되면 실행
      - dev
      - test
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여
      #    테스트 코드가 DB에 접속해야 한다면 이 단계에서 환경 변수가 필요.
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Gradle 빌드 및 테스트 (예: Docker 이미지 빌드 후 Push 또는 EC2에 배포)
      #    이 단계에서도 애플리케이션을 실행해야 하므로 동일하게 환경 변수를 주입.
      - name: Build with Gradle
        # env 블록을 통해 GitHub Secret을 환경 변수로 주입.
        run: ./gradlew build
        env:
          DB_PASSWORD: ${{ secrets.BOARD_DB_PASSWORD }}
          HOLIDAY_SERVICE_KEY: ${{ secrets.HOLIDAY_SERVICE_KEY }}
          GPR_SYS_PATH: ${{ secrets.COMM_SYS_PACKAGE_PATH }}
          GPR_BIZ_PATH: ${{ secrets.COMM_BIZ_PACKAGE_PATH }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 실제 배포 단계
      - name: Deploy to Server
        run: |
          # 여기에 실제 배포 스크립트를 작성합니다.
          # 예: ssh, scp, docker push 등
          echo "Deploying to server..."