# spring: 키 아래에 spring 관련 설정을 그룹화합니다.
spring:
  application:
    name: notic_board
  # h2: 키 아래에 h2 관련 설정을 그룹화합니다.
  h2:
    # console: 키 아래에 h2 콘솔 관련 설정을 그룹화합니다.
    console:
      # H2 데이터베이스 콘솔을 활성화합니다. (http://localhost:8080/h2-console)
      enabled: true
      # H2 콘솔의 접속 경로를 설정합니다.
      path: /h2-console

  # datasource: 키 아래에 데이터소스 관련 설정을 그룹화합니다.
  datasource:
    # JDBC URL: 'testdb'라는 이름의 인메모리 H2 데이터베이스를 사용합니다.
#    url: jdbc:h2:mem:testdb
    url: jdbc:h2:file:./data/h2demo
    # 데이터베이스 드라이버 클래스 이름입니다.
    driver-class-name: org.h2.Driver
    # 데이터베이스 접속 사용자 이름입니다.
    username: sa
    # 데이터베이스 접속 비밀번호입니다. (공백)
    password:

  # jpa: 키 아래에 JPA 관련 설정을 그룹화합니다.
  jpa:
    # 데이터베이스 종류에 맞는 SQL을 생성하기 위한 방언(Dialect) 설정입니다.
    database-platform: org.hibernate.dialect.H2Dialect
    # DDL 자동 생성 전략입니다. 애플리케이션 시작 시 테이블을 생성합니다. create, create-drop, update, validate, none(default)
    hibernate:
      ddl-auto: update
    # JPA가 실행하는 SQL 쿼리를 로그로 출력합니다.
    show-sql: true
    # properties: 키 아래에 hibernate의 추가 속성을 설정합니다.
    properties:
      hibernate:
        # 출력되는 SQL 쿼리를 보기 좋게 포맷팅합니다.
        format_sql: true