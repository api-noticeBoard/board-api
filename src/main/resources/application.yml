# =========================================
#  공통 설정 (모든 프로필에 적용)
# =========================================
spring:
  application:
    name: notic_board
  # 로컬에서 별도 설정 없이 실행 시 'dev' 프로필을 기본으로 사용합니다.
  profiles:
    active: dev

# OpenAPI(Swagger) 공통 정보: API의 제목, 설명 등은 모든 환경에서 동일합니다.
openapi:
  info:
    title: "게시판 프로젝트 API 명세서"
    description: "게시판 서비스 및 Core 개발을 위한 API 문서입니다."
    version: "v1.0.0"
    contact:
      name: "jimiboy"
      email: "200493019@naver.com"

# Springdoc 공통 설정: API 문서의 경로, 스캔할 패키지 등은 모든 환경에서 동일합니다.
springdoc:
  api-docs:
    path: /v1/api
  packages-to-scan: com.portfolio.board