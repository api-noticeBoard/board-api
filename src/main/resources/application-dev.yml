# =========================================
#  로컬 개발(dev) 프로필 설정 (H2 DB)
# =========================================
server:
  shutdown: graceful
#  port: 8081
  servlet:
    encoding:
      charset: utf-8
      force: true

spring:
  security:
    user:
      name: admin
      password: admin
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    # TODO: DB서버로 변경 예정
    # Oracle Autonomous Database
    url: jdbc:oracle:thin:@(description= (retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.ap-chuncheon-1.oraclecloud.com))(connect_data=(service_name=gde55684cd674ef_boarddb_medium.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))
    username: ADMIN
    password: ${BOARD_DB_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver
    # 로컬 개발 시 재시작해도 데이터가 유지되도록 파일 기반 H2를 사용합니다.
#    url: jdbc:h2:file:./data/h2demo;AUTO_SERVER=TRUE
#    driver-class-name: org.h2.Driver
#    username: sa
#    password:
  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect
    # 1. database-platform을 Oracle 용으로 변경.
    #    Oracle 12c 이상 버전의 경우 아래 설정을 권장.
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # 개발 편의를 위해 테이블을 자동으로 업데이트합니다.
      ddl-auto: update
    # 개발 시에는 SQL을 확인하는 것이 디버깅에 도움이 됩니다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# dev 환경에서는 Swagger UI를 활성화합니다.
springdoc:
  swagger-ui:
    path: /swagger-ui
    enabled: true