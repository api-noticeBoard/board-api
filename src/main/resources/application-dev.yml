# =========================================
#  로컬 개발(dev) 프로필 설정 (H2 DB)
# =========================================
server:
  shutdown: graceful
#  port: 8081
  servlet:
    encoding:
      charset: utf-8
      force: true

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    # TODO: DB서버로 변경 예정
    # 로컬 개발 시 재시작해도 데이터가 유지되도록 파일 기반 H2를 사용합니다.
    url: jdbc:h2:file:./data/devdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 개발 편의를 위해 테이블을 자동으로 업데이트합니다.
      ddl-auto: update
    # 개발 시에는 SQL을 확인하는 것이 디버깅에 도움이 됩니다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# dev 환경에서는 Swagger UI를 활성화합니다.
springdoc:
  swagger-ui:
    path: /swagger
    enabled: true